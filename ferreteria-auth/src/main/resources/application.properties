server.port=8081

# Base de datos H2 en memoria para pruebas locales sin XAMPP
spring.datasource.url=jdbc:h2:mem:ferreteria_auth_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2 (opcional, útil para mirar tus tablas en el navegador)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración JWT (Clave Base64 de 256 bits para pruebas locales)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=3600000
